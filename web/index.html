<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat WebSocket</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Chat WebSocket</h1>

      <section class="configuration">
        <label>
          Você é:
          <select id="user">
            <option value="caio">Caio</option>
            <option value="ana">Ana</option>
          </select>
        </label>

        <label>
          Conversar com:
          <select id="recipient">
            <option value="ana">Ana</option>
            <option value="caio">Caio</option>
          </select>
        </label>

        <button id="connect">Conectar</button>
        <button id="disconnect" disabled>Desconectar</button>
      </section>

      <p>Status: <strong id="status">Desconectado</strong></p>

      <section class="chat">
        <ul id="messages" aria-live="polite"></ul>

        <form id="message-form">
          <input
            id="message"
            placeholder="Digite sua mensagem..."
            autocomplete="off"
            required
          />
          <button id="send" type="submit" disabled>Enviar</button>
        </form>
      </section>
    </main>
  </body>
</html>
